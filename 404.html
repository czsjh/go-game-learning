<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>围棋学习</title>
  <script>
    // GitHub Pages 单页应用路由处理
    var l = window.location;
    var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/go-game-learning/' +
      '?p=' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash;
    l.replace(newUrl);
  </script>
</head>
<body>
  正在跳转到围棋学习网站...
</body>
</html>
